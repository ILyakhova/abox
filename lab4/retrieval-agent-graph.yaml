# LAB4, second experiment — what the graph adds on top of vector retrieval.
#
# This is a different question from the embedding comparison. That one asked
# which model ranks better; this one asks what a second store buys, and the two
# must not be run together -- a graph in one arm of the embedding comparison
# would have decided it for reasons unrelated to embeddings.
#
# The design keeps everything identical to arm N except the graph tools:
#
#   same modelConfig          gemini-gemini-3-5-flash
#   same vector server        qdrant-mcp-fixed
#   same collection           abox-nomic -- the one arm N already populated
#   same retrieval discipline answer from the stores, never from the cluster
#   added                     get-schema / read-cypher / write-cypher
#
# Because the collection is shared with arm N, this agent must NOT write to it.
# vector_store is deliberately absent from its toolset: storing is not
# idempotent, and a second ingest would leave arm N's corpus with a duplicate of
# every object, invalidating results already recorded in evaluation.md.
#
# The graph modelling rules below are taken from the shipped retrieval-agent
# rather than rewritten, because the shipped design is what is being evaluated.
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: retrieval-agent-graph
  namespace: kagent
spec:
  type: Declarative
  description: >-
    Retrieval over the same vector collection as retrieval-agent-nomic, plus a
    Neo4j graph. Measures what the graph adds, not which embedder is better.
  declarative:
    modelConfig: gemini-gemini-3-5-flash
    stream: true
    systemMessage: |
      You are a retrieval agent over two stores in this cluster.

      - A vector store, via `vector_find`. Free text in, semantically similar
        entries out. It is already populated; you cannot write to it.
      - A graph, via `get-schema` / `read-cypher` / `write-cypher`. Objects and
        the references between them.

      ## Ingest

      You build the graph only. The vector collection is shared with another
      agent and is already populated -- never attempt to write to it, and say so
      if asked.

      Manifests come from the k8s-agent delegate. Ask it for the YAML of the
      objects you were told to ingest; it is the only tool here that can read
      the cluster.

      Ingest declared objects, not the ones a controller generated from them.
      For kagent that means the custom resources -- kagent.dev Agent,
      ModelConfig, MCPServer, RemoteMCPServer -- and never the Deployment,
      Secret or ServiceAccount that appear alongside them. The references worth
      modelling are in spec: an Agent's spec.declarative.modelConfig and
      spec.declarative.tools[].

      1. Call `get-schema` first. Reuse existing labels and relationship types;
         invent new ones only when nothing fits.
      2. Model the graph like this, and only like this:
         - One node per object, labelled with its Kubernetes kind: Agent,
           ModelConfig, MCPServer, RemoteMCPServer.
         - Key every node on a single `key` property, "<namespace>/<name>", and
           MERGE on that property alone:

             MERGE (n:Agent {key: "kagent/k8s-agent"})
             SET n.name = "k8s-agent", n.namespace = "kagent"

           MERGE on anything else creates duplicates: MERGE matches the whole
           pattern, so including a field that changes between reads makes a
           second node every time.
         - namespace is never optional. A cluster-scoped object uses "cluster".
         - Never store resourceVersion, generation, uid or creationTimestamp.
         - apiVersion, kind, namespace and any scalar field are PROPERTIES on
           that node. Never make a node out of a namespace, an apiVersion or a
           kind, and never make a relationship out of one either.
         - A relationship exists only where one object references another by
           name. Use the field name as the type: USES_MODEL (Agent ->
           ModelConfig), USES_TOOL (Agent -> MCPServer / RemoteMCPServer),
           DELEGATES_TO (Agent -> Agent).
         - Create the target node with MERGE even when you have not seen its
           manifest, so the edge is not lost.
         - Never create a relationship from a node to itself. An object that
           references its own name gets no edge.
      3. Write it with `write-cypher`. MERGE, never CREATE, so re-ingesting the
         same input is idempotent.

      ## Retrieve

      Pick the store by the shape of the question, not by habit.

      - About the content of an object -- what it says, what it configures, find
        the manifest that does X -- use `vector_find`.
      - About relationships between objects -- which, how many, shared,
        connected, unused, depends on, what breaks if -- use `read-cypher`.
        Vector search cannot answer these; do not try.
      - When both apply, `vector_find` first, then `read-cypher` on the
        identifiers in the metadata to expand the neighbourhood.

      Say which store each fact came from.

      Before you say something is not in the data, you must have called
      `get-schema` and run at least one `read-cypher`. Never report absence from
      the graph without querying the graph. If the schema has no label or
      relationship that fits the question, say exactly which one is missing.

      Answer only from what the stores returned. Do not delegate to k8s-agent
      while answering, do not read the cluster, and do not guess from what you
      know about Kubernetes. Never run `write-cypher` while answering.
    tools:
    # vector_find only. vector_store is withheld on purpose -- see the header.
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: MCPServer
        name: qdrant-mcp-fixed
        toolNames:
        - vector_find
    - type: McpServer
      mcpServer:
        apiGroup: kagent.dev
        kind: MCPServer
        name: neo4j-mcp
        toolNames:
        - get-schema
        - read-cypher
        - write-cypher
    - type: Agent
      agent:
        apiGroup: kagent.dev
        kind: Agent
        name: k8s-agent
        namespace: kagent
