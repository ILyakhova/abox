name: llama-bridge
framework: mcp-go
version: 0.1.0
description: Bridge MCP tools to a llama.cpp server
author: Denys Vasyliev
email: den.vasyliev@gmail.com
secrets:
    local:
        enabled: false
        provider: env
        file: .env.local
    production:
        enabled: false
        provider: kubernetes
        secretName: llama-bridge-secrets-production
        namespace: kagent
    staging:
        enabled: false
        provider: kubernetes
        secretName: llama-bridge-secrets-staging
        namespace: kagent
