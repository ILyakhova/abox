# llm-d serving nomic-embed-text-v1.5 on CPU (embeddings URL #1).
#
# Mirrors a working deployment on a reference GKE cluster
# (helm release llm-d/llm-d-modelservice-embedding, chart v0.3.17), with four
# deliberate deviations for abox -- each called out inline below.
#
# What is NOT installed here, and why:
#
#   llm-d-infra -- it exists to stand up a Gateway + GatewayParameters. abox
#                  already has one (agentgateway-external, allowedRoutes: from
#                  All), and on KinD a second LoadBalancer Gateway would just
#                  contend for the single available LB address. The HTTPRoute at
#                  the bottom attaches to the existing Gateway instead.
#
# The InferencePool + EPP the reference deployment runs ARE installed, at the
# bottom of this file. They need the inference.networking.* CRDs, which are not
# part of Gateway API -- see releases/crds/inference-extension-crds.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: llm-d
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: llm-d-modelservice
  namespace: flux-system
spec:
  interval: 1h
  # An HTTP Helm repo, like qdrant -- llm-d does not publish these charts to an
  # OCI registry, so this is chart.spec + HelmRepository, not chartRef.
  url: https://llm-d-incubation.github.io/llm-d-modelservice/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llm-d-embedding
  namespace: llm-d
spec:
  interval: 1h
  releaseName: llm-d-embedding
  chart:
    spec:
      chart: llm-d-modelservice
      # Pinned to the version the reference deployment runs. v0.4.x is current
      # upstream but moves the values schema; bump both together after
      # re-rendering.
      version: "v0.3.17"
      sourceRef:
        kind: HelmRepository
        name: llm-d-modelservice
        namespace: flux-system
  install:
    createNamespace: true
  values:
    accelerator:
      type: cpu

    modelArtifacts:
      name: nomic-ai/nomic-embed-text-v1.5
      # hf:// fetches from HuggingFace. Combined with mountModelVolume below
      # the download is cached in an emptyDir, so it survives a container
      # restart but not pod recreation -- first Ready after a reschedule is
      # still gated on ~550MB of safetensors, not just model load.
      #
      # Eliminating the re-download needs one of:
      #
      #   pvc://<claim>/<path>  -- model pre-staged on a PVC, zero download, but
      #     something has to populate the PVC first and the chart does not
      #     create it (there is no PersistentVolumeClaim template).
      #
      #   pvc+hf://<claim>/hub/<org>/<model> -- HF_HUB_CACHE on a PVC, so it
      #     downloads once and persists. NOT usable on this chart version:
      #     v0.3.17 hardcodes readOnly: true on the PVC mount, so the cache
      #     cannot be written. v0.4.x makes it modelArtifacts.readOnly, so this
      #     would need a chart bump.
      #
      #   oci:// -- would bake the weights into an image the way the llama.cpp
      #     backend does. The volume helper implements it via a Kubernetes image
      #     volume, but values.yaml still says "not yet supported" and image
      #     volumes are recent enough to be a poor bet on KinD.
      uri: hf://nomic-ai/nomic-embed-text-v1.5
      size: 2Gi
      # These land on the pod template and are what the Service below selects.
      labels:
        llm-d.ai/inferenceServing: "true"
        llm-d.ai/model: nomic-embed-text-v1-5
      # DEVIATION 1: no authSecretName. The reference deployment points this at
      # an HF token Secret, which makes the chart render an HF_TOKEN env from
      # it -- and the pod then fails to start if that Secret is absent.
      # nomic-embed-text-v1.5 is a public repo (unlike the gated gemma weights),
      # so abox needs no token and no Secret to bootstrap.

    prefill:
      create: false

    decode:
      create: true
      replicas: 1
      monitoring:
        podmonitor:
          # DEVIATION 2: off. A PodMonitor is a
          # monitoring.coreos.com/v1 object and abox ships no Prometheus
          # Operator, so leaving this on fails the release with
          # "no matches for kind PodMonitor in version monitoring.coreos.com/v1".
          enabled: false
      containers:
        - name: vllm
          modelCommand: vllmServe
          # The chart defaults this to true, but overriding decode.containers
          # wholesale (as this does) drops that default. Without it no
          # model-storage volume is rendered and HF_HOME is never set, so vllm
          # downloads the ~550MB of weights straight into the container's
          # writable layer on every start -- uncapped, and lost on any restart.
          #
          # With it, the download lands in the model-storage emptyDir bounded by
          # modelArtifacts.size and survives a container restart within the pod.
          # It is still re-fetched when the POD is recreated; see the note on
          # modelArtifacts.uri for what that would take to fix properly.
          mountModelVolume: true
          # DEVIATION 3: the reference deployment runs
          # vllm-openai-cpu:latest-x86_64, which is amd64-only and will not
          # schedule on a KinD node running on an arm64 Mac. The unsuffixed tag
          # is a multi-arch index (amd64 + arm64), and pinning beats :latest.
          image: vllm/vllm-openai-cpu:v0.29.0
          imagePullPolicy: IfNotPresent
          args:
            # --runner pooling is the v0.29 spelling of the old --task embed:
            # it puts the engine in pooling mode so /v1/embeddings is served
            # and the generation endpoints are not.
            - --runner
            - pooling
            # nomic-bert is not an upstream-registered architecture; without
            # this vllm refuses to build the model.
            - --trust-remote-code
            - --max-model-len
            - "8192"
            # No CUDA graph capture / torch.compile warmup -- pure win on CPU.
            - --enforce-eager
            # The reference deployment also passes --gpu-memory-utilization 0.5,
            # a leftover from its GPU profile that a CPU runner ignores. Dropped.
          env:
            - name: VLLM_CPU_NUM_OF_RESERVED_CPU
              value: "1"
            # DEVIATION 4: 1 GiB, not the reference deployment's 4. This is a hard up-front
            # reservation and a pooling runner never fills a KV cache -- the
            # whole embed is one forward pass. On a Codespace this is the
            # difference between scheduling and OOM.
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "1"
            # 2, not 4: a default Codespace is 2 vCPU total, shared with the
            # other two kind nodes and everything else in releases/.
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
            # Rust frontend, in place of the Python API server process. This is
            # the single best lever available here, for two reasons.
            #
            # Memory: the 2452Mi measured on the reference cluster is three Python processes
            # each importing torch -- Worker 1294MiB, API server 621MiB,
            # EngineCore 491MiB. This flag is what replaces that 621MiB API
            # server; the engine and the ZMQ boundary are unchanged.
            #
            # Throughput: upstream reports ~837 req/s vs ~162 for the Python
            # frontend on a preprocess-heavy workload. Embeddings are the
            # extreme case of preprocess-heavy -- tokenization dominates and the
            # forward pass through a 137M-param BERT is trivial -- so this
            # workload should sit at the favourable end of that range, not the
            # marginal one.
            #
            # Note it does NOT fall back: envs.py raises FileNotFoundError if
            # the vllm-rs binary is missing. It is present in this image --
            # docker/Dockerfile.cpu at v0.29.0 builds it in a dedicated stage
            # and line 224 copies it to vllm/vllm-rs, which is exactly where
            # _resolve_rust_cli_path looks. Verify that again before bumping the
            # image tag.
            - name: VLLM_USE_RUST_FRONTEND
              value: "1"
          ports:
            - containerPort: 8000
              name: metrics
          # initialDelaySeconds is generous on purpose: it covers the
          # HuggingFace download above plus model load.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # DEVIATION 5: CPU sized down, memory NOT. Measured on the reference deployment's
          # own idle embedding pod:
          #
          #   $ kubectl top pod -n llm-d
          #   llm-d-modelservice-embedding-decode-...   178m   2466Mi
          #
          # So the reference deployment's 2 CPU request is ~11x what it uses
          # and can come down, but
          # 2466Mi is a floor -- nomic-embed-text-v1.5 is a 137M-param BERT and
          # essentially all of that is the torch/vLLM runtime, not the weights.
          # Anything requesting under ~2.5Gi gets OOMKilled once it loads.
          #
          # For contrast, llama.cpp serves the same model in ~75Mi
          # (releases/llama-cpp-embeddings.yaml). That gap IS the thing being
          # evaluated here -- do not "fix" it by starving this pod.
          resources:
            requests:
              cpu: 250m
              memory: 2560Mi
            limits:
              cpu: "2"
              memory: 4Gi

    routing:
      servicePort: 8000
      proxy:
        # The llm-d-routing-sidecar is a nixl connector for prefill/decode
        # disaggregation. With prefill.create false there is nothing to
        # disaggregate, and it only adds a hop in front of vllm. Off here means
        # vllm binds routing.servicePort (8000) itself instead of 8200.
        enabled: false
---
# The modelservice chart renders a Deployment but no Service (the reference
# deployment's were
# applied by hand), so it is spelled out here. Selector matches the pod labels
# the chart derives from modelArtifacts.labels + the decode role.
apiVersion: v1
kind: Service
metadata:
  name: llm-d-embedding
  namespace: llm-d
spec:
  selector:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: nomic-embed-text-v1-5
    llm-d.ai/role: decode
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
# InferencePool + EPP (endpoint picker), the reference deployment's inference pool.
#
# Chart v1.5.0 is the newest PUBLISHED one -- registry.k8s.io has no
# inferencepool chart at v1.6.0/v1.6.1 even though those GIE releases exist.
# It also ships no crds/ directory, hence releases/crds/inference-extension-crds.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: inferencepool
  namespace: flux-system
spec:
  interval: 1h
  url: oci://registry.k8s.io/gateway-api-inference-extension/charts/inferencepool
  ref:
    # Tags here carry the leading v -- "1.5.0" is not found.
    tag: "v1.5.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llm-d-pool
  namespace: llm-d
spec:
  interval: 1h
  releaseName: llm-d-pool
  dependsOn:
    # The EPP watches the pool's endpoints; without the model pods there is
    # nothing to pick. Not a hard requirement, but it keeps first-apply ordering
    # readable.
    - name: llm-d-embedding
      namespace: llm-d
  chartRef:
    kind: OCIRepository
    name: inferencepool
    namespace: flux-system
  install:
    createNamespace: true
  values:
    provider:
      # the reference cluster sets this to "gke", which renders GKE-specific
      # HealthCheckPolicy/GCPBackendPolicy objects whose CRDs only exist on GKE.
      # "none" is the right value for KinD.
      name: none
    inferenceExtension:
      apiVersion: inference.networking.k8s.io/v1
      monitoring:
        prometheus:
          # abox has no Prometheus Operator -- same reason the decode PodMonitor
          # above is off.
          enabled: false
        gke:
          enabled: false
    inferencePool:
      name: llm-d-pool
      # The GA group. agentgateway resolves InferencePool backendRefs through
      # sigs.k8s.io/gateway-api-inference-extension/api/v1 (see
      # controller/pkg/wellknown/gwapi.go), so v1 is what it can actually route to.
      apiVersion: inference.networking.k8s.io/v1
      targetPortNumber: 8000
      modelServers:
        # Scoped to THIS model, not the blanket llm-d.ai/inferenceServing: "true"
        # the reference deployment uses. A pool is per base model: the moment a
        # second model is
        # added, a blanket selector silently pulls its pods into this pool and
        # the EPP starts handing embedding requests to the wrong server.
        matchLabels:
          llm-d.ai/model: nomic-embed-text-v1-5
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
# The reference cluster still has an InferenceModel for this, but that kind is
# gone: GIE dropped
# inferencemodels from config/crd/bases in v1.4.0. InferenceObjective is the
# successor, and the older copies survive only because its CRD predates the bundle
# its cluster now runs.
#
# Written out by hand rather than via the chart's inferenceObjectives value --
# that template is broken upstream in v1.5.0 (templates/inferenceobjectives.yaml
# dereferences .Values inside a range, so it renders as
# "nil pointer evaluating interface {}.inferenceExtension").
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceObjective
metadata:
  name: nomic-embed-text
  namespace: llm-d
spec:
  priority: 1
  poolRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: llm-d-pool
---
# Embeddings URL #1, external:  http://<gateway-ip>/llmd/v1/embeddings
#                   in-cluster: http://llm-d-embedding.llm-d:8000/v1/embeddings
#
# Two rules, mirroring the reference deployment's internal route: embeddings go straight to
# the decode Service, everything else goes through the pool. The bypass is
# deliberate on the reference cluster and worth keeping -- the EPP's scorers (prefix-cache,
# kv-cache-utilization, queue) and its openai-parser are built around
# decode/prefill generation traffic, not a pooling runner's single-shot
# /v1/embeddings. With one replica of one model there is also nothing to
# schedule. The pool is what makes this extend to a second model later.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-d-embedding
  namespace: llm-d
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-external
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /llmd/v1/embeddings
      filters:
        # Both backends serve OpenAI-compatible /v1/embeddings, so they can only
        # share one Gateway listener if the prefix is stripped before the hop.
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1/embeddings
      backendRefs:
        - name: llm-d-embedding
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /llmd
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: llm-d-pool
          port: 8000
