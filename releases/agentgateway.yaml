apiVersion: v1
kind: Namespace
metadata:
  name: agentgateway-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  interval: 1h
  # Held at v2.2.1: the v2.2.2 and v2.2.3 charts reference
  # cr.agentgateway.dev/controller:<chart version>, but that registry only ever
  # published v2.2.0 and v2.2.1, so newer charts fail with ErrImagePull.
  url: oci://ghcr.io/kgateway-dev/charts/agentgateway
  ref:
    tag: "v2.2.1"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: agentgateway-system
spec:
  interval: 1h
  releaseName: agentgateway
  dependsOn:
    - name: agentgateway-crds
      namespace: agentgateway-system
  chartRef:
    kind: OCIRepository
    name: agentgateway
    namespace: flux-system
  install:
    createNamespace: true
  values:
    # Required by releases/llmd.yaml -- without it an HTTPRoute backendRef to an
    # InferencePool silently never resolves. The flag gates two things in the
    # chart: KGW_ENABLE_INFER_EXT on the controller, and the ClusterRole letting
    # it watch inferencepools / inferencepools/status / inferenceobjectives /
    # endpointslices. It defaults to false; the reference cluster sets exactly this and nothing
    # else on its own agentgateway release.
    #
    # Note this is the data plane too, not just a control-plane toggle: the same
    # deployment template hardcodes KGW_ENABLE_AGENTGATEWAY=true and
    # KGW_ENABLE_ENVOY=false, so inference traffic is proxied by agentgateway
    # (Rust) and no Envoy is deployed. The Envoy-backed path is the separate
    # "kgateway" GatewayClass, which abox does not install.
    inferenceExtension:
      enabled: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-external
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
