# Same name as panda's, different provider: panda's is GeminiVertexAI on
# Workload Identity, which KinD has no equivalent of. This is the AI Studio
# API, which needs only a key.
#
# Create the key before Flux reconciles this:
#   kubectl -n kagent create secret generic kagent-gemini \
#     --from-literal=GOOGLE_API_KEY=...
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: gemini-gemini-2-5-flash
  namespace: kagent
spec:
  provider: Gemini
  model: gemini-2.5-flash
  apiKeySecret: kagent-gemini
  apiKeySecretKey: GOOGLE_API_KEY
