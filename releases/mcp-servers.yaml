# MCP servers run by kagent's kmcp controller. kmcp creates a Service named
# after the MCPServer and adapts stdio servers to streamable HTTP.
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: neo4j-mcp
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    image: neo4j/mcp:v1.6.0
    cmd: /app/neo4j-mcp
    env:
      NEO4J_MCP_URI: bolt://neo4j.neo4j:7687
      NEO4J_MCP_USERNAME: neo4j
      # Matches releases/neo4j.yaml.
      NEO4J_MCP_PASSWORD: abox-neo4j
      NEO4J_MCP_DATABASE: neo4j
      NEO4J_MCP_READ_ONLY: "false"
      NEO4J_MCP_TELEMETRY: "false"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: qdrant-mcp
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    # Ours; scaffolded with `kmcp init go`, source in mcp/qdrant-mcp. Replaces
    # mcp-server-qdrant, which could only embed in-process with fastembed and
    # was OOMKilled doing it.
    image: ghcr.io/den-vasyliev/abox/qdrant-mcp:0.4.0
    cmd: /app/server
    env:
      # Any OpenAI-compatible /v1/embeddings route. This is llm-d's decode
      # Service, hit directly rather than through the EPP -- the scorers are
      # built for generation traffic, not a pooling runner's single-shot embed.
      # Direct means no model-based routing, so EMBEDDINGS_MODEL stays unset:
      # llama.cpp ignores it and serves the one GGUF it was given. The
      # standalone Deployment is the other route,
      # http://llama-cpp-embeddings.llama-cpp:8090, and chat gets a 501 against
      # either -- both are started with --embeddings and have no generation
      # head. A managed endpoint needs EMBEDDINGS_MODEL and EMBEDDINGS_API_KEY;
      # see mcp/qdrant-mcp/README.md.
      EMBEDDINGS_BASE_URL: http://llm-d-embedding.llm-d:8000
      # vector_store / vector_find embed through the same endpoint, so the
      # agent's memory lands in the vector space the gateway serves. The
      # collection is named for that space, and the two routes are not the same
      # space: llm-d serves the GGUF at Q8_0 -- 145MB for 136.7M params -- and
      # the standalone Deployment at f16. Same model, same 768 dims, different
      # kernels; close enough to look right and far enough to rank wrong. The
      # f16 vectors stay in abox-nomic.
      QDRANT_URL: http://qdrant.qdrant:6333
      QDRANT_COLLECTION: abox-nomic-q8
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 256Mi
