# MCP servers run by kagent's kmcp controller. kmcp creates a Service named
# after the MCPServer and, for stdio servers, fronts them with an agentgateway
# proxy on 3000; an http server is reached directly on its own port.
#
# neo4j-mcp and memgraph-mcp are alternatives to each other, one per graph
# backend. Both are installed; the graph-rag-agent references neo4j-mcp.
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: neo4j-mcp
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    image: neo4j/mcp:v1.6.0
    cmd: /app/neo4j-mcp
    env:
      NEO4J_MCP_URI: bolt://neo4j.neo4j:7687
      NEO4J_MCP_USERNAME: neo4j
      # Matches releases/neo4j.yaml.
      NEO4J_MCP_PASSWORD: abox-neo4j
      NEO4J_MCP_DATABASE: neo4j
      NEO4J_MCP_READ_ONLY: "false"
      NEO4J_MCP_TELEMETRY: "false"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: qdrant-mcp
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    # Ours; scaffolded with `kmcp init go`, source in mcp/qdrant-mcp. Replaces
    # mcp-server-qdrant, which could only embed in-process with fastembed and
    # was OOMKilled doing it.
    image: ghcr.io/den-vasyliev/abox/qdrant-mcp:0.3.0
    cmd: /app/server
    env:
      # Any OpenAI-compatible /v1/embeddings route. This one is the standalone
      # llama.cpp Deployment, started with --embeddings, so llama_chat gets a
      # 501 until a generative server is pointed at. Swap in llm-d with
      # http://llm-d-embedding.llm-d:8000 plus EMBEDDINGS_MODEL, or a managed
      # endpoint plus EMBEDDINGS_API_KEY -- see mcp/qdrant-mcp/README.md.
      EMBEDDINGS_BASE_URL: http://llama-cpp-embeddings.llama-cpp:8090
      # qdrant_store / qdrant_find embed through the same endpoint, so the
      # agent's memory lands in the vector space the gateway serves. The
      # collection is named for the model, not the runtime: dimensions differ
      # between models and the same model under a different runtime still moves
      # the vectors, so repointing EMBEDDINGS_BASE_URL means a new collection.
      QDRANT_URL: http://qdrant.qdrant:6333
      QDRANT_COLLECTION: abox-nomic
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: memgraph-mcp
  namespace: kagent
spec:
  # Python/FastMCP, so http rather than stdio: FastMCP's stdio loop returns on
  # stdin EOF and the container would exit on every session teardown. FastMCP
  # mounts at /mcp/ and 307s /mcp, so the trailing slash matters.
  transportType: http
  httpTransport:
    targetPort: 8000
    path: /mcp/
  deployment:
    image: memgraph/mcp-memgraph:0.4.0
    port: 8000
    env:
      MEMGRAPH_URL: bolt://memgraph.memgraph:7687
      MEMGRAPH_DATABASE: memgraph
      # "memgraph-experimental" is the other option.
      MCP_SERVER: server
      # The image sets both already; repeated here because the transport is the
      # whole reason this one is not stdio.
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      # Defaults to true, which blocks CREATE/MERGE/DELETE/SET/DROP/REMOVE and
      # so blocks ingest.
      MCP_READ_ONLY: "false"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
