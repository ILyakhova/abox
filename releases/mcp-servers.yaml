# MCP servers run by kagent's kmcp controller. kmcp creates a Service named
# after the MCPServer and adapts stdio servers to streamable HTTP.
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: neo4j-mcp
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    image: neo4j/mcp:v1.6.0
    cmd: /app/neo4j-mcp
    env:
      NEO4J_MCP_URI: bolt://neo4j.neo4j:7687
      NEO4J_MCP_USERNAME: neo4j
      # Matches releases/neo4j.yaml.
      NEO4J_MCP_PASSWORD: abox-neo4j
      NEO4J_MCP_DATABASE: neo4j
      NEO4J_MCP_READ_ONLY: "false"
      NEO4J_MCP_TELEMETRY: "false"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: llama-bridge
  namespace: kagent
spec:
  transportType: stdio
  stdioTransport: {}
  deployment:
    # Scaffolded with `kmcp init go`; source in mcp/llama-bridge.
    image: ghcr.io/den-vasyliev/abox/llama-bridge:0.2.2
    cmd: /app/server
    env:
      # The standalone llama.cpp Deployment, started with --embeddings. So
      # llama_embed, llama_health, llama_props, llama_models and llama_tokenize
      # work; llama_chat gets a 501 until a generative server is pointed at.
      LLAMA_BASE_URL: http://llama-cpp-embeddings.llama-cpp:8090
      # qdrant_store / qdrant_find embed through LLAMA_BASE_URL, so the agent's
      # memory lands in the same vector space the gateway serves. Replaces
      # mcp-server-qdrant, which could only embed in-process with fastembed and
      # was OOMKilled doing it.
      QDRANT_URL: http://qdrant.qdrant:6333
      QDRANT_COLLECTION: abox-llamacpp
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 256Mi
