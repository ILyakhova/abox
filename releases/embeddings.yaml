apiVersion: v1
kind: Namespace
metadata:
  name: embeddings
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: embeddings
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
  namespace: embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embeddings
  template:
    metadata:
      labels:
        app: embeddings
    spec:
      # Fetch the GGUF once into the PVC. Keeping the download out of the main
      # container means a pod restart does not re-pull 140 MiB.
      initContainers:
      - name: fetch-model
        image: curlimages/curl:8.11.1
        command:
        - sh
        - -c
        - |
          set -eu
          f=/models/nomic-embed-text-v1.5.Q8_0.gguf
          [ -s "$f" ] && exit 0
          curl -fL -o "$f.tmp" \
            https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q8_0.gguf
          mv "$f.tmp" "$f"
        volumeMounts:
        - name: models
          mountPath: /models
      containers:
      - name: llama-server
        # Resolved 2026-09-13; re-resolve to move the image forward.
        image: ghcr.io/ggml-org/llama.cpp@sha256:cbcdcb52d484e08e23bfc0135afa5beadd2d540513bbb7c65b233231fa033ff4
        args:
        - -m
        - /models/nomic-embed-text-v1.5.Q8_0.gguf
        - --embeddings
        - --pooling
        - mean
        - -c
        - "8192"
        - -b
        - "8192"
        - -ub
        - "8192"
        - --rope-scaling
        - yarn
        # 0.25, not the 0.75 the model card prints: llama.cpp caps a slot at
        # n_ctx_train / rope_freq_scale, and this GGUF reports n_ctx_train = 2048,
        # so 0.75 silently caps the context at 2730 instead of 8192.
        - --rope-freq-scale
        - "0.25"
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: models
          mountPath: /models
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          # Sized for a 2-core / 8 GB Codespace, which is already carrying three
          # KinD nodes plus agentgateway, kagent with its postgres, qdrant and
          # phoenix. Raise both on a larger host.
          limits:
            cpu: "1"
            memory: 1Gi
        # /health returns 503 until weights are loaded. The budget is generous for
        # the same reason releases/phoenix.yaml widened its startup probe: KinD is
        # slow, and a tight probe restarts the container before it ever binds.
        startupProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  namespace: embeddings
spec:
  selector:
    app: embeddings
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: embeddings
  namespace: embeddings
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: embeddings
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: embeddings
  namespace: embeddings
spec:
  parentRefs:
  - name: agentgateway-external
    namespace: agentgateway-system
  rules:
  # kagent already claims '/' on this Gateway. Gateway API resolves overlapping
  # prefixes by longest match, so '/v1/embeddings' wins here without touching
  # releases/kagent.yaml. Shortening this prefix would break that.
  - matches:
    - path:
        type: PathPrefix
        value: /v1/embeddings
    backendRefs:
    - name: embeddings
      namespace: embeddings
      port: 8080
