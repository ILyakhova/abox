apiVersion: v1
kind: Namespace
metadata:
  name: agentgateway-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway-crds
  namespace: flux-system
spec:
  interval: 1h
  # The agentgateway project's own chart stream, not kgateway-dev's. The
  # kgateway-dev v2.2.x CRDs are rejected by Kubernetes 1.37: the
  # AgentgatewayBackend schema's CEL rules exceed the cost budget by >100x.
  # agentgateway 1.5.x supports Kubernetes 1.32-1.37 and Gateway API 1.4-1.6.
  url: oci://cr.agentgateway.dev/charts/agentgateway-crds
  ref:
    tag: "1.5.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-crds
  namespace: agentgateway-system
spec:
  interval: 1h
  releaseName: agentgateway-crds
  chartRef:
    kind: OCIRepository
    name: agentgateway-crds
    namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
